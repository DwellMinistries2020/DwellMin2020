<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dwell Ministries</title>
  <meta name="description" content="The official website of Dwell Ministries. Join Sunday worship and Tuesday night prayer online.">
  <style>
    * { box-sizing: border-box; }
    html { font-size: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #17110f;
      color: #fffaf4;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }
    main { width: min(100%, 760px); }
    .eyebrow {
      margin: 0 0 18px;
      color: #f2ca7d;
      font: 700 0.875rem/1.3 Arial, sans-serif;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 9vw, 6.5rem);
      font-weight: 500;
      line-height: 0.95;
    }
    .message {
      margin: 28px auto 0;
      color: #f4ece4;
      font: 400 clamp(1.125rem, 2.5vw, 1.35rem)/1.65 Arial, sans-serif;
    }
    .schedule {
      display: grid;
      gap: 8px;
      margin: 20px auto 30px;
      color: #fffaf4;
      font: 700 clamp(1rem, 2.3vw, 1.2rem)/1.5 Arial, sans-serif;
    }
    .schedule span {
      display: block;
    }
    .join-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: min(100%, 420px);
      min-height: 64px;
      padding: 18px 28px;
      border: 3px solid #fffaf4;
      border-radius: 14px;
      background: #f2ca7d;
      color: #17110f;
      font: 800 clamp(1.125rem, 3vw, 1.4rem)/1.2 Arial, sans-serif;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
      transition: transform .15s ease, background-color .15s ease;
    }
    .join-button:hover { background: #ffe1a6; transform: translateY(-2px); }
    .join-button:focus-visible {
      outline: 5px solid #ffffff;
      outline-offset: 5px;
    }
    .help {
      margin: 18px auto 0;
      color: #e7ddd2;
      font: 400 1rem/1.5 Arial, sans-serif;
    }
    @media (max-width: 480px) {
      body { padding: 20px 16px; }
      .join-button { min-height: 68px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .join-button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Welcome to</p>
    <h1>Dwell Ministries</h1>
    <p class="message">Where God dwells, transformation happens, and you belong.</p>
    <div class="schedule" aria-label="Weekly online service schedule">
      <span>Sunday Worship · 11:30 AM Eastern</span>
      <span>Tuesday Night Prayer · 7:30 PM Eastern</span>
    </div>
    <a class="join-button"
       href="https://us06web.zoom.us/j/84132704184?pwd=czUrdXgrT2FVTENVc0M1clpGWXhVZz09"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Join Dwell Ministries Sunday worship or Tuesday night prayer on Zoom">
      Join Our Live Service
    </a>
    <p class="help">Select the button above to open Zoom.</p>
  </main>
</body>
</html>
