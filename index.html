<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dwell Ministries</title>
  <meta name="description" content="The official website of Dwell Ministries.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #17110f;
      color: #fffaf4;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }
    main { max-width: 720px; }
    p:first-child {
      margin: 0 0 18px;
      color: #d8b26e;
      font: 600 0.8rem/1.2 Arial, sans-serif;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 9vw, 6.5rem);
      font-weight: 500;
      line-height: 0.95;
    }
    p:last-child {
      margin: 28px auto 0;
      color: #e7ddd2;
      font: 400 clamp(1rem, 2.5vw, 1.25rem)/1.7 Arial, sans-serif;
    }
  </style>
</head>
<body>
  <main>
    <p>Welcome to</p>
    <h1>Dwell Ministries</h1>
    <p>Our new online home is being prepared. Please check back soon.</p>
  </main>
</body>
</html>
